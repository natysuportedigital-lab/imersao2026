<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imersão Empresarial Papo Segurança</title>
<style>html,body{margin:0;background:#050806;color:#fff;font-family:Arial,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}</style>
</head>
<body>
<div id="loading">Carregando...</div>
<script>
(async()=>{
  try{
    let html=await (await fetch('./site-full.html?v=mobile-cta-fix',{cache:'no-store'})).text();

    // Remove SOMENTE o botão flutuante mobile "Ver opções de ingresso".
    html=html.replace(/\s*<a\b(?=[^>]*class="[^"]*\bmobile-cta\b[^"]*")[^>]*>.*?<\/a>/is,'');

    // Move o botão transparente para a segunda dobra: remove somente do hero.
    html=html.replace(
      /(<div class="hero-actions ps-hero-v2-actions">[\s\S]*?)<a class="btn btn-outline" href="#temas">[\s\S]*?Ver o que será discutido ↓[\s\S]*?<\/a>/i,
      '$1'
    );

    // Segurança extra: não afeta botões normais nem o WhatsApp.
    html=html.replace('</style>','<style>.mobile-cta{display:none!important}.second-fold-cta{margin:28px 0 8px}.second-fold-cta .btn{width:auto}@media(max-width:620px){.second-fold-cta{margin:24px 0 6px}.second-fold-cta .btn{width:100%;justify-content:center}}</style></style>');

    // Adiciona o botão transparente também na segunda dobra, antes dos blocos de problemas.
    if(!html.includes('second-fold-cta')){
      html=html.replace(
        '<div class="problem-grid">',
        '<div class="second-fold-cta"><a class="btn btn-outline" href="#temas">Ver o que será discutido ↓</a></div><div class="problem-grid">'
      );
    }

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Não foi possível carregar a página. Atualize e tente novamente.';
  }
})();
</script>
</body>
</html>
