<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imersão Empresarial Papo Segurança</title>
<style>
html,body{margin:0;background:#050806;color:#fff;font-family:Arial,sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
</style>
</head>
<body>
<div id="loading">Carregando...</div>
<script>
(async()=>{
  try{
    const url='https://raw.githubusercontent.com/natysuportedigital-lab/imersao2026/a98a3f5fbec316eba20aa4a388a1b0a238dd21b8/index.html?v=whatsapp-sem-cta-mobile';
    let html=await (await fetch(url,{cache:'no-store'})).text();
    html=html.replace('<h3>VIP</h3>','');
    html=html.replace(/\s*<a class="btn btn-primary mobile-cta" href="#ingressos">\s*Ver opções de ingresso ↓\s*<\/a>/,'');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Não foi possível carregar a página. Atualize e tente novamente.';
  }
})();
</script>
</body>
</html>
